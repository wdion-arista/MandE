### VRF Specific

# This is used to build the Terninattr daemon
custom_structured_configuration_daemon_terminattr:
  clusters:
    # - name: OnPrem
    #   cvaddrs:
    #     - 192.168.0.5:9910
    #   cvauth:
    #     method: "token"
    #     token_file: "/tmp/token"
    #   cvvrf: default
    #   # cvsourceintf: Management1
    - name: CVaaS
      cvaddrs:
        - apiserver.arista.io:443
      cvauth:
        method: "token-secure"
        token_file: "/tmp/cv-onboarding-token"
      # cvvrf: MGMT
      # cvsourceintf: Management1
  disable_aaa: true
  smashexcludes: "ale,flexCounter,hardware,kni,pulse,strata"
  ingestexclude: "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"

### NTP Servers ###
custom_structured_configuration_ntp:
  vrf: default
  servers:
    - name: 216.232.132.95
    - name: 23.133.168.244

# DNS Server
custom_structured_configuration_ip_name_server:
  vrfs:
    - name: default
      servers:
        - ip_address: 169.254.169.254
    - name: MGMT
      servers:
        - ip_address: 8.8.8.8
        - ip_address: 169.254.169.254
    - name: Production
      servers:
        - ip_address: 8.8.8.8
        - ip_address: 169.254.169.254
